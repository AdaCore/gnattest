stages:
  - build
  - test
  - optional
  - check

include:
  # Issue check
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/check-issue@~latest

  # gnatformat check
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/gnatformat@main
    inputs:
      stage: check
      anod-spec: gnattest
      gnatformat-args: -P src/build.gpr --check
      install-gnatformat: true
      install-gnatformat-extra-anod-args: -Qedge

  # Build
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      anod-args: run build_$ACI_TRACK
      cpus: 16
      image: pe-base
      save-component: true

  # Testing
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/test@~latest
    inputs:
      job-name: gnattest
      anod-args: run test_$ACI_TRACK
      image: pe-base
      cpus: 16
      disk: 80

  - component: $CI_SERVER_FQDN/eng/gitlab-templates/test@~latest
    inputs:
      job-name: gnattest-gnatfuzz
      anod-args: run test_gnatfuzz_tests
      image: pe-base
      cpus: 8
      disk: 80
      rules:
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
          changes:
            paths:
              - src/tgen/**/*
              - src/test-*
              - share/tgen/templates/**/*
              - testsuite/testsuite.py
              - testsuite/drivers/gnattest_tgen.py
            compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME


.common_test_before_script: &test_before_script
  before_script:
    - mkdir $CI_PROJECT_DIR/coverage

.common_test_after_script: &test_after_script
  after_script:
    - cat /tmp/ci_env.sh
    - . /tmp/ci_env.sh
    - TEST_BSN=$(anod eval --primitive=test gnattest -Q instr-cov build_space_name --sandbox-dir=$ANOD_DEFAULT_SANDBOX_DIR)
    - mv $ANOD_DEFAULT_SANDBOX_DIR/x86_64-linux/$TEST_BSN/test/coverage/cobertura.xml $CI_PROJECT_DIR/coverage/cobertura.xml

.common_artifacts_bits: &artifacts
  artifacts:
    paths:
      - xunit-*.xml
      - coverage/cobertura.xml

    reports:
      junit: xunit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

gnattest:linux:
  <<: *test_before_script
  <<: *test_after_script
  <<: *artifacts

gnattest-gnatfuzz:linux:
  <<: *test_before_script
  <<: *test_after_script
  <<: *artifacts
